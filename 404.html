<style>
@font-face {
  font-family: 'Departure Mono';
  src: url('assets/fonts/DepartureMono-Regular.woff2') format('woff2'),
       url('assets/fonts/DepartureMono-Regular.otf') format('opentype');
  font-weight: 400; font-style: normal; font-display: swap;
}
:root { --paper:#fdf6e9; --ink:#17141f; --dim:#5b5442;
        --hue-1:#ffd23f; --hue-2:#ff9838; --hue-3:#ff6482; --hue-5:#6ecbff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--paper);
  background-image: radial-gradient(rgba(23,20,31,.055) 1px, transparent 1px);
  background-size: 22px 22px;
  color:var(--ink); min-height:100vh;
  font-family:'Departure Mono', ui-monospace, Menlo, monospace;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:1.8rem; padding:2rem; }
.flap { position:relative; display:inline-block; width:1.32em; height:1.8em;
  border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink); --th:var(--hue-1); }
.flap .fh { position:absolute; left:0; right:0; height:50%; overflow:hidden; background:var(--th); }
.flap .fh-t { top:0; border-bottom:2px solid var(--ink); filter:brightness(1.07); }
.flap .fh-b { bottom:0; filter:brightness(.9); }
.flap i { font-style:normal; display:block; height:1.8em; line-height:1.8em; text-align:center; }
.flap .fh-b i { transform:translateY(-.9em); }
.row { font-size:2.2rem; display:flex; gap:.45rem; }
.bar { width:min(420px, 80vw); height:8px; border:2px solid var(--ink);
  background:linear-gradient(90deg, var(--hue-1), var(--hue-2), var(--hue-3), var(--hue-5)); }
h1 { font-size:1rem; letter-spacing:.14em; background:var(--hue-1);
  border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:.25rem .8rem; }
p { color:var(--dim); font-size:.85rem; line-height:1.8; max-width:44ch; }
a { color:var(--ink); border-bottom:2px solid var(--hue-3); text-decoration:none; }
a:hover { background:var(--hue-1); }
</style>
</head>
